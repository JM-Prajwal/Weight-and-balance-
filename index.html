<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W&B Calculator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            background-color: #f9f9f9;
            color: #333;
        }
        h2 { text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px; 
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #004494; }
        
        .error {
            color: #d9534f;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            display: none;
            padding: 10px;
            border: 1px solid #d9534f;
            border-radius: 8px;
            background-color: #fdf5f5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th { background-color: #f2f2f2; }
        
        #results-container { display: none; }
        .cg-result {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            color: #28a745;
        }
    </style>
</head>
<body>

    <h2>Weight & Balance</h2>

    <div class="input-group">
        <label>Aircraft Registration (Last 3 letters):</label>
        <!-- Changed to 3 letters -->
        <input type="text" id="ac-id" maxlength="3" placeholder="e.g., AAQ" oninput="this.value = this.value.toUpperCase()">
    </div>

    <div class="input-group">
        <label>PIC Weight (lbs):</label>
        <input type="number" id="pic-weight" placeholder="Must be greater than 0">
    </div>

    <div class="input-group">
        <label>Trainee Weight (lbs):</label>
        <input type="number" id="trainee-weight" placeholder="Can be 0">
    </div>

    <div class="input-group">
        <label>Fuel (Liters):</label>
        <input type="number" id="fuel-liters" placeholder="Enter usable fuel in Liters">
    </div>

    <button onclick="calculateWB()">Calculate</button>

    <div id="error-msg" class="error"></div>

    <div id="results-container">
        <table>
            <tr>
                <th>Item</th>
                <th>Weight (lbs)</th>
                <th>Arm (in)</th>
                <th>Moment</th>
            </tr>
            <tr>
                <td>Basic Empty</td>
                <td id="r-ew"></td>
                <td id="r-ea"></td>
                <td id="r-em"></td>
            </tr>
            <tr>
                <td>PIC</td>
                <td id="r-picw"></td>
                <td>37</td>
                <td id="r-picm"></td>
            </tr>
            <tr>
                <td>Trainee</td>
                <td id="r-trainw"></td>
                <td>37</td>
                <td id="r-trainm"></td>
            </tr>
            <tr>
                <td id="r-fuel-label">Fuel</td>
                <td id="r-fuelw"></td>
                <td>48</td>
                <td id="r-fuelm"></td>
            </tr>
            <tr>
                <th>TOTAL</th>
                <th id="r-tw"></th>
                <th>--</th>
                <th id="r-tm"></th>
            </tr>
        </table>
        
        <div class="cg-result">CG: <span id="r-cg"></span> in.</div>
    </div>

    <script>
        // --- PUT YOUR 4 AIRCRAFT DATA HERE (3 Letters Each) ---
        const fleetData = {
            "AAQ": { emptyWeight: 1668.59, emptyArm: 39.09 }, 
            "AAO": { emptyWeight: 1672.66, emptyArm: 39.0 },
            "RRM": { emptyWeight: 1693.68, emptyArm: 39.89 },
            "JSN": { emptyWeight: 1695.88, emptyArm: 39.34 }
        };

        function calculateWB() {
            // 1. Clear previous errors & results
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('results-container').style.display = 'none';

            // 2. Grab inputs
            let acId = document.getElementById('ac-id').value.trim();
            let picWeight = parseFloat(document.getElementById('pic-weight').value);
            let traineeWeight = parseFloat(document.getElementById('trainee-weight').value);
            let fuelLiters = parseFloat(document.getElementById('fuel-liters').value);

            // Handle empty Trainee or Fuel as 0
            if (isNaN(traineeWeight)) traineeWeight = 0;
            if (isNaN(fuelLiters)) fuelLiters = 0;

            // 3. Validations
            if (!fleetData[acId]) {
                // Generates the error dynamically based on your 4 fleet codes
                let validCodes = Object.keys(fleetData).join(", ");
                showError("Invalid Registration! Please enter a valid 3-letter code from your fleet (" + validCodes + ").");
                return;
            }
            if (isNaN(picWeight) || picWeight <= 0) {
                showError("Error: PIC Weight must be greater than 0.");
                return;
            }

            // 4. Aircraft Basic Empty Calculations
            let ac = fleetData[acId];
            let basicMoment = ac.emptyWeight * ac.emptyArm;

            // 5. PIC & Trainee Calculations (Multiplier: 37)
            let picMoment = picWeight * 37;
            let traineeMoment = traineeWeight * 37;

            // 6. Fuel Calculations
            let fuelGallons = fuelLiters / 3.8;
            let fuelWeight = fuelGallons * 6;
            let fuelMoment = fuelWeight * 48;

            // 7. Vertically Add Columns
            let totalWeight = ac.emptyWeight + picWeight + traineeWeight + fuelWeight;
            let totalMoment = basicMoment + picMoment + traineeMoment + fuelMoment;

            // 8. Calculate CG
            let cg = totalMoment / totalWeight;

            // 9. Display the math visually
            document.getElementById('r-ew').innerText = ac.emptyWeight.toFixed(2);
            document.getElementById('r-ea').innerText = ac.emptyArm.toFixed(2);
            document.getElementById('r-em').innerText = basicMoment.toFixed(2);

            document.getElementById('r-picw').innerText = picWeight.toFixed(2);
            document.getElementById('r-picm').innerText = picMoment.toFixed(2);

            document.getElementById('r-trainw').innerText = traineeWeight.toFixed(2);
            document.getElementById('r-trainm').innerText = traineeMoment.toFixed(2);
            
            document.getElementById('r-fuel-label').innerText = "Fuel (" + fuelGallons.toFixed(2) + " US GAL)";
            document.getElementById('r-fuelw').innerText = fuelWeight.toFixed(2);
            document.getElementById('r-fuelm').innerText = fuelMoment.toFixed(2);

            document.getElementById('r-tw').innerText = totalWeight.toFixed(2);
            document.getElementById('r-tm').innerText = totalMoment.toFixed(2);
            
            document.getElementById('r-cg').innerText = cg.toFixed(2);

            // Show results
            document.getElementById('results-container').style.display = 'block';
        }

        function showError(msg) {
            let errorDiv = document.getElementById('error-msg');
            errorDiv.innerText = msg;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
